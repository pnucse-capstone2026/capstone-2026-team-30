<title>Kyverno Governance Platform — EKS API 최적화 배포 아키텍처</title>
<desc>Hub-Spoke 멀티클러스터 기반 AWS EKS 거버넌스 아키텍처. K8s Informer 인메모리 캐시 및 CQRS 트래픽 분리를 통해 EKS API 서버 과부하를 원천 차단한다. 브라우저가 ALB를 통해 Next.js와 NestJS에 접근하며, Read는 Informer 캐시에서 무부하 서빙하고 Write(승인 예외/PR)만 안전하게 전송한다.</desc>
