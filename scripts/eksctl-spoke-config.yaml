apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: kyverno-eks-spoke-01
  region: us-east-1
  version: "1.32"

iam:
  withOIDC: true

managedNodeGroups:
  - name: freetier-spot-nodes
    instanceTypes: ["c7i-flex.large", "m7i-flex.large", "c6i.large", "m6i.large", "t3.large"]
    spot: true
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    volumeType: gp3
    maxPodsPerNode: 110
    labels:
      environment: "production"
      role: "spoke-worker"
    tags:
      Environment: "EKS-Spoke"
      ManagedBy: "eksctl"
