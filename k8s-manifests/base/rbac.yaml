# Kyverno Governance Platform 백엔드 ServiceAccount(kyverno-backend-sa) 정의
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kyverno-backend-sa
  namespace: kyverno-platform
  labels:
    app.kubernetes.io/name: kyverno-backend
    app.kubernetes.io/part-of: kyverno-governance-platform
---
# Kyverno Governance Platform 백엔드 ServiceAccount(kyverno-backend-sa) 권한 정의
# 플랫폼 백엔드 및 AI 거버넌스 에이전트가 정책, 리포트, 리소스 상태를 감사하고 정책 예외를 처리할 수 있도록 최소 권한(Least-Privilege) 부여
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-backend-cluster-role
  labels:
    app.kubernetes.io/name: kyverno-backend
    app.kubernetes.io/part-of: kyverno-governance-platform
rules:
  # 웹 대시보드 및 AI 에이전트를 통한 PolicyException(정책 예외) 신청, 승인, 만료 삭제 등 전체 라이프사이클 관리 권한
  - apiGroups:
      - "kyverno.io"
    resources:
      - "policyexceptions"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"

  # 클러스터 및 네임스페이스 정책 생성, 수정, 삭제 및 현황 조회 권한
  - apiGroups:
      - "kyverno.io"
    resources:
      - "clusterpolicies"
      - "policies"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"

  # 정책 위반 감사 결과(PolicyReport, ClusterPolicyReport) 수집 및 대시보드 컴플라이언스 지표 시각화를 위한 읽기 권한
  - apiGroups:
      - "wgpolicyk8s.io"
    resources:
      - "policyreports"
      - "clusterpolicyreports"
    verbs:
      - "get"
      - "list"
      - "watch"

  # 네임스페이스 격리 상태, 위반 파드/서비스/설정 점검, 클러스터 노드 지표 및 이벤트 실시간 감시를 위한 코어 리소스 권한
  - apiGroups:
      - ""
    resources:
      - "namespaces"
      - "pods"
      - "services"
      - "configmaps"
      - "persistentvolumeclaims"
      - "events"
      - "nodes"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"

  # 분산 백엔드 고가용성(HA) 지원 및 단일 Watcher/Informer 기동을 위한 Kubernetes 리더 선출 Lease 관리 권한
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - "leases"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"

  # Argo CD 거버넌스 동기화 상태 감시를 위한 애플리케이션 조회 권한
  - apiGroups:
      - "argoproj.io"
    resources:
      - "applications"
    verbs:
      - "get"
      - "list"
      - "watch"

  # MLOps Kubeflow Notebook 프로비저닝 및 생명주기 관리를 위한 권한
  - apiGroups:
      - "kubeflow.org"
    resources:
      - "notebooks"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"

  # 정책 위반 워크로드(Deployment) 스펙 검사 및 Bedrock AI 분석 프롬프트 컨텍스트 구성을 위한 워크로드 읽기 권한
  - apiGroups:
      - "apps"
    resources:
      - "deployments"
    verbs:
      - "get"
      - "list"
      - "watch"
---
# kyverno-platform 네임스페이스의 kyverno-backend-sa에 kyverno-backend-cluster-role 권한을 바인딩
# 백엔드 Pod가 In-Cluster ServiceAccount 토큰을 통해 Kubernetes API 서버와 안전하게 통신하도록 설정
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-backend-cluster-role-binding
  labels:
    app.kubernetes.io/name: kyverno-backend
    app.kubernetes.io/part-of: kyverno-governance-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-backend-cluster-role
subjects:
  - kind: ServiceAccount
    name: kyverno-backend-sa
    namespace: kyverno-platform
