apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-frontend
  namespace: kyverno-platform
  labels:
    app.kubernetes.io/name: kyverno-frontend
    app.kubernetes.io/part-of: kyverno-governance-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kyverno-frontend
  template:
    metadata:
      labels:
        app: kyverno-frontend
    spec:
      containers:
        - name: frontend
          image: kyverno-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: INTERNAL_BACKEND_URL
              value: "http://kyverno-backend.kyverno-platform.svc.cluster.local:3001"
            - name: NEXT_PUBLIC_API_URL
              value: ""
            - name: NEXT_PUBLIC_API_BASE_URL
              value: ""
            - name: NEXT_PUBLIC_ADMIN_EMAIL
              value: "admin@pac-kyverno.local"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kyverno-frontend
  namespace: kyverno-platform
  labels:
    app.kubernetes.io/name: kyverno-frontend
    app.kubernetes.io/part-of: kyverno-governance-platform
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: kyverno-frontend
