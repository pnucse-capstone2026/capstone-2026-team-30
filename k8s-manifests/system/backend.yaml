# Kyverno Governance Platform NestJS 백엔드 (AI 에이전트 및 거버넌스 API) 배포 매니페스트
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-backend
  namespace: kyverno-platform
  labels:
    app.kubernetes.io/name: kyverno-backend
    app.kubernetes.io/part-of: kyverno-governance-platform
spec:
  replicas: 1
  # 무중단 롤링 배포를 위해 이전 파드 종료 전 신규 파드 선기동 전략 적용
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kyverno-backend
  template:
    metadata:
      labels:
        app: kyverno-backend
    spec:
      serviceAccountName: kyverno-backend-sa
      containers:
        - name: backend
          # Kyverno disallow-latest-tag 준수 및 GitOps 버그 픽스 릴리즈 이미지 지정
          image: 945125812546.dkr.ecr.us-east-1.amazonaws.com/kyverno-backend:v9-assisted-recovery
          imagePullPolicy: Always
          # 호스트의 .env 환경변수를 Secret으로 주입받아 GitHub 토큰 및 설정을 동기화
          envFrom:
            - secretRef:
                name: backend-env-secret
                optional: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "postgresql://devuser:devpassword@postgres.kyverno-platform.svc.cluster.local:5432/kyverno_dashboard?schema=public"
            - name: JWT_ACCESS_SECRET
              value: "in-cluster-jwt-access-secret-key-12345"
            - name: JWT_REFRESH_SECRET
              value: "in-cluster-jwt-refresh-secret-key-12345"
            # AWS 표준 기본 리전 지정
            - name: AWS_REGION
              value: "us-east-1"
            - name: BEDROCK_MODEL_ID
              value: "amazon.nova-lite-v1:0"
            # GitOps 게시 배포 전략 및 임시 예외 TTL 필터링 환경 변수
            - name: GITOPS_PUBLISHING_MODE
              value: "DUAL_PATH"
            # GitOps 전략: GitHub PR 자동 개설 모드 활성화
            - name: GITOPS_STRATEGY
              value: "GITHUB_PR"
            # GitOps 대상 원격 테스트 리포지토리 지정 (PR 자동 개설 목적)
            - name: GITOPS_GITHUB_REPO
              value: "YeongrimGo/test-for"
            - name: GITOPS_GITHUB_BASE_BRANCH
              value: "main"
            # 긴급 운영을 위해 승인된 예외 PR의 base 브랜치 자동 병합 활성화
            - name: GITOPS_AUTO_MERGE
              value: "true"
            - name: GITOPS_MIN_DURATION_HOURS
              value: "24"
            - name: KUBERNETES_EXCEPTION_NAMESPACE
              value: "kyverno"
            - name: KUBERNETES_CLUSTER_ID
              value: "kyverno-eks-lab"
          ports:
            - containerPort: 3001
          # 인스턴스 자원 고갈 및 OOMKilled 방지를 위한 리소스 상한선 설정
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # 백엔드 서버 기동 및 DB 쿼리 연결 상태를 확인하여 비정상 파드로의 트래픽 라우팅 차단
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          # 프로세스 데드락 및 장애 발생 시 자동 재기동을 통한 고가용성 유지 (Readiness 프로브 타임라인 정렬)
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5

---
# 클러스터 내부 통신 및 로컬 포트포워딩 진입을 위한 백엔드 Service
apiVersion: v1
kind: Service
metadata:
  name: kyverno-backend
  namespace: kyverno-platform
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: kyverno-backend

