# Audit 정책 테스트용 감사 대상 워크로드 매니페스트
# 배포는 허용되되 PolicyReport에 정책 위반(fail)이 기록되는지 검증하기 위한 목적
apiVersion: v1
kind: Pod
metadata:
  name: e2e-audit-pod
  labels:
    app.kubernetes.io/name: e2e-audit-pod
    test-purpose: kyverno-audit-report-e2e
spec:
  containers:
    - name: app
      image: redis:latest
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
