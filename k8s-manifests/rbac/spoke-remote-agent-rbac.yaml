# Spoke 클러스터 전용 원격 에이전트(Remote Agent) RBAC 권한 매니페스트
# [도입 배경] Hub의 백엔드 대시보드가 Spoke 클러스터의 Kyverno 정책/예외 감사 및
#             MLOps Kubeflow Notebook 생명주기를 원격 제어하기 위한 최소 권한 부여
# [기대 효과] Spoke 클러스터에서의 MLOps 노트북 프로비저닝(Notebook CRD, PVC) 및
#             정책 예외(PolicyException) 생성/조회 작업의 정합성과 무결성 보장
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-remote-agent-role
  labels:
    app.kubernetes.io/name: kyverno-remote-agent
    app.kubernetes.io/part-of: kyverno-governance-platform
rules:
  # 1. Kyverno 정책 및 정책 예외 관리 권한
  - apiGroups:
      - kyverno.io
    resources:
      - clusterpolicies
      - policies
      - policyexceptions
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # 2. 정책 리포트 감사 권한
  - apiGroups:
      - wgpolicyk8s.io
    resources:
      - policyreports
      - clusterpolicyreports
    verbs:
      - get
      - list
      - watch

  # 3. Argo CD Application 모니터링 권한
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch

  # 4. MLOps Kubeflow Notebooks CRD 관리 권한
  - apiGroups:
      - kubeflow.org
    resources:
      - notebooks
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # 5. 코어 리소스 조회, 노드 관제 지표 수집, 파드 시뮬레이션 배포 및 PVC 프로비저닝 권한
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - events
      - services
      - configmaps
      - nodes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-remote-agent-rolebinding
  labels:
    app.kubernetes.io/name: kyverno-remote-agent
    app.kubernetes.io/part-of: kyverno-governance-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-remote-agent-role
subjects:
  - kind: ServiceAccount
    name: kyverno-remote-agent-sa
    namespace: kyverno
