# 인증되지 않은 외부 이미지 레지스트리로부터의 공급망 공격을 차단하기 위한 Kyverno 정책
# 대시보드 및 PolicyReport 실시간 감지/감사를 위해 validationFailureAction을 Audit으로 설정
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: 컨테이너 이미지가 승인된 AWS ECR 레지스트리에서만 가져와지도록 강제합니다.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - kyverno-platform
                - argocd
                - kubeflow
                - local-path-storage
                - kube-public
                - kube-node-lease
                - notebook-controller-system
      validate:
        message: "승인되지 않은 외부 이미지 레지스트리입니다. 사내 AWS ECR(945125812546.dkr.ecr.us-east-1.amazonaws.com/*), 검증된 ECR(public.ecr.aws/*) 또는 Kubernetes 공식(registry.k8s.io/*) 이미지만 배포 가능합니다."
        pattern:
          spec:
            containers:
              - image: "945125812546.dkr.ecr.us-east-1.amazonaws.com/* | public.ecr.aws/* | registry.k8s.io/* | docker.io/kubeflownotebookswg/* | kubeflownotebookswg/* | quay.io/kubeflow/*"
