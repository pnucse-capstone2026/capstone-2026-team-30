# 대규모 ML 모델 학습 워크로드에 Spot 인스턴스 노드 셀렉터 및 Toleration을 자동 주입하여 클라우드 컴퓨팅 비용 절감
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-spot-node-selector
  annotations:
    policies.kyverno.io/title: Enforce Spot Node Selector for ML Training Jobs
    policies.kyverno.io/category: MLOps Governance & Cost Optimization
    policies.kyverno.io/minversion: "1.6.0"
    policies.kyverno.io/severity: Medium
    policies.kyverno.io/subject: Job, Pod
    policies.kyverno.io/description: >-
      비정기 ML 배치 학습 워크로드(TFJob, PyTorchJob, Job 등)에 Spot 인스턴스 노드 셀렉터와
      Toleration을 자동으로 주입하여 컴퓨팅 비용을 최대 70% 절감합니다.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: mutate-spot-node-selector
      match:
        any:
          - resources:
              kinds:
                - Job
                - Pod
              namespaces:
                - mlops-workspace
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - kyverno-platform
                - local-path-storage
                - kube-public
                - kube-node-lease
      mutate:
        patchStrategicMerge:
          spec:
            =(template):
              spec:
                nodeSelector:
                  +(cloud.google.com/gke-spot): "true"
                tolerations:
                  - +(key): "spot"
                    +(operator): "Equal"
                    +(value): "true"
                    +(effect): "NoSchedule"
            nodeSelector:
              +(cloud.google.com/gke-spot): "true"
            tolerations:
              - +(key): "spot"
                +(operator): "Equal"
                +(value): "true"
                +(effect): "NoSchedule"
