# Production Kyverno Policies 검증용 CLI 자동화 스위트
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: production-policies-test
policies:
  - disallow-latest-tag.yaml
  - require-resource-limits.yaml
  - disallow-privileged-containers.yaml
resources:
  - ../testbed/violating-web-app.yaml
  - ../testbed/violating-privileged-debugger.yaml
  - ../testbed/compliant-app.yaml
results:
  - policy: disallow-latest-tag
    rule: disallow-latest-tag
    resource: violating-web-app
    kind: Pod
    result: fail
  - policy: require-resource-limits
    rule: validate-resource-requests-limits
    resource: violating-web-app
    kind: Pod
    result: fail
  - policy: disallow-privileged-containers
    rule: disallow-privileged-containers
    resource: violating-privileged-debugger
    kind: Pod
    result: fail
  - policy: require-resource-limits
    rule: validate-resource-requests-limits
    resource: violating-privileged-debugger
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: disallow-latest-tag
    resource: compliant-app
    kind: Pod
    result: pass
  - policy: require-resource-limits
    rule: validate-resource-requests-limits
    resource: compliant-app
    kind: Pod
    result: pass
  - policy: disallow-privileged-containers
    rule: disallow-privileged-containers
    resource: compliant-app
    kind: Pod
    result: pass
