<svg width="2400" height="1400" viewBox="0 0 2400 1400" xmlns="http://www.w3.org/2000/svg" style="background:#0b0f19; font-family:'Noto Sans CJK KR', 'Ubuntu', 'DejaVu Sans', sans-serif;">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrBlue2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arrAmber2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="2400" height="1400" fill="url(#bg2)"/>

  <!-- HEADER -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="2240" height="90" rx="14" fill="#131c2e" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="25" y="24" width="100" height="42" rx="8" fill="#d97706"/>
    <text x="75" y="51" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">AWS EKS</text>
    <text x="150" y="45" fill="#f8fafc" font-size="26" font-weight="800">AWS EKS Production Infrastructure &amp; Cloud Security</text>
    <text x="150" y="70" fill="#94a3b8" font-size="14">AWS VPC (us-east-1), Multi-AZ ALB Ingress, EKS Managed NodeGroup, IRSA Least-Privilege &amp; 프리티어 비용 최적화</text>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP ROW: INBOUND TRAFFIC & AWS MANAGED SERVICES (y: 170)                  -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 170)">
    <!-- Traffic Source -->
    <g transform="translate(0, 0)" filter="url(#shadow2)">
      <rect x="0" y="0" width="700" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <rect x="20" y="20" width="90" height="28" rx="6" fill="#0284c7"/>
      <text x="65" y="39" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">TRAFFIC</text>
      <text x="125" y="40" fill="#f8fafc" font-size="18" font-weight="700">Internet Users &amp; GitHub Actions CI/CD</text>
      <text x="20" y="80" fill="#cbd5e1" font-size="14">HTTPS / HTTP Port 80, 443 인바운드 트래픽</text>
      <text x="20" y="105" fill="#94a3b8" font-size="13">GitHub Actions OIDC AssumeRole 기반 무암호화 자동 배포 파이프라인</text>
    </g>

    <!-- AWS Managed Services -->
    <g transform="translate(740, 0)" filter="url(#shadow2)">
      <rect x="0" y="0" width="1500" height="130" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <rect x="20" y="20" width="130" height="28" rx="6" fill="#d97706"/>
      <text x="85" y="39" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">AWS SERVICES</text>
      <text x="165" y="40" fill="#f8fafc" font-size="18" font-weight="700">AWS Cloud Managed Ecosystem (Region: us-east-1)</text>

      <g transform="translate(20, 60)">
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="340" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
          <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="700">Amazon Bedrock</text>
          <text x="15" y="44" fill="#cbd5e1" font-size="12">Claude 3.5 Sonnet / Nova Lite</text>
        </g>

        <g transform="translate(360, 0)">
          <rect x="0" y="0" width="340" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
          <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="700">AWS IAM OIDC Provider</text>
          <text x="15" y="44" fill="#cbd5e1" font-size="12">Zero-Secret Least-Privilege IRSA</text>
        </g>

        <g transform="translate(720, 0)">
          <rect x="0" y="0" width="340" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
          <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="700">Amazon ECR</text>
          <text x="15" y="44" fill="#cbd5e1" font-size="12">보안 프라이빗 컨테이너 레지스트리</text>
        </g>

        <g transform="translate(1080, 0)">
          <rect x="0" y="0" width="360" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
          <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="700">CloudWatch &amp; VPC Logs</text>
          <text x="15" y="44" fill="#cbd5e1" font-size="12">중앙 감사 및 네트워크 플로우 로깅</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- MAIN CONTAINER: AWS VPC (y: 350, height: 980)                             -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 350)" filter="url(#shadow2)">
    <rect x="0" y="0" width="2240" height="980" rx="16" fill="#111827" stroke="#d97706" stroke-width="2.5"/>

    <!-- VPC Header -->
    <rect x="25" y="20" width="90" height="34" rx="6" fill="#d97706"/>
    <text x="70" y="43" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">AWS VPC</text>
    <text x="130" y="44" fill="#f8fafc" font-size="22" font-weight="800">Virtual Private Cloud: 10.0.0.0/16 (us-east-1)</text>
    <text x="780" y="44" fill="#fbbf24" font-size="15" font-weight="600">Internet Gateway (IGW) | Multi-AZ (AZ-a, AZ-b) | VPC CNI Prefix Delegation</text>

    <!-- SECTION 1: PUBLIC SUBNETS (ALB & INGRESS) -->
    <g transform="translate(25, 75)">
      <rect x="0" y="0" width="2190" height="190" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="20" y="15" width="130" height="26" rx="4" fill="#0284c7"/>
      <text x="85" y="33" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">PUBLIC SUBNETS</text>
      <text x="165" y="34" fill="#f8fafc" font-size="16" font-weight="700">AWS Application Load Balancer &amp; Ingress Routing</text>

      <!-- ALB Box -->
      <g transform="translate(20, 55)">
        <rect x="0" y="0" width="600" height="115" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="15" y="28" fill="#38bdf8" font-size="15" font-weight="700">AWS ALB (Internet-Facing)</text>
        <text x="15" y="55" fill="#cbd5e1" font-size="13">• Scheme: Internet-Facing | Ports: 80 / 443</text>
        <text x="15" y="80" fill="#cbd5e1" font-size="13">• <tspan fill="#4ade80" font-weight="700">Target-Type: IP</tspan> (Pod IP로 직접 초고속 라우팅)</text>
        <text x="15" y="102" fill="#94a3b8" font-size="12">AWS Load Balancer Controller에 의해 자동 프로비저닝</text>
      </g>

      <!-- Routing Rules Box -->
      <g transform="translate(640, 55)">
        <rect x="0" y="0" width="900" height="115" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="15" y="28" fill="#38bdf8" font-size="15" font-weight="700">ALB Ingress Path Routing Rules (kyverno-ingress)</text>
        <rect x="15" y="42" width="410" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="25" y="65" fill="#fbbf24" font-size="13" font-weight="700">Path: /api/* (Prefix)</text>
        <text x="25" y="88" fill="#cbd5e1" font-size="12">--&gt; kyverno-backend:3001 (Health: /api/health)</text>

        <rect x="445" y="42" width="440" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="455" y="65" fill="#38bdf8" font-size="13" font-weight="700">Path: /* (Prefix)</text>
        <text x="455" y="88" fill="#cbd5e1" font-size="12">--&gt; kyverno-frontend:3000 (Next.js Standalone UI)</text>
      </g>

      <!-- Controller Box -->
      <g transform="translate(1560, 55)">
        <rect x="0" y="0" width="610" height="115" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="15" y="28" fill="#38bdf8" font-size="15" font-weight="700">AWS Load Balancer Controller</text>
        <text x="15" y="55" fill="#cbd5e1" font-size="13">• Namespace: kube-system</text>
        <text x="15" y="80" fill="#cbd5e1" font-size="13">• Ingress CRD 감지 시 ALB TargetGroup 자동 생성/삭제</text>
        <text x="15" y="102" fill="#94a3b8" font-size="12">IAM Role: AWSLoadBalancerControllerRole</text>
      </g>
    </g>

    <!-- SECTION 2: PRIVATE SUBNETS (EKS MANAGED NODEGROUPS) -->
    <g transform="translate(25, 290)">
      <rect x="0" y="0" width="2190" height="660" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="15" width="140" height="26" rx="4" fill="#059669"/>
      <text x="90" y="33" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">PRIVATE SUBNETS</text>
      <text x="175" y="34" fill="#f8fafc" font-size="16" font-weight="700">EKS Managed NodeGroup &amp; Pod Workloads (VPC CNI Prefix Delegation)</text>

      <!-- Worker Node 1 -->
      <g transform="translate(20, 55)">
        <rect x="0" y="0" width="1060" height="580" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
        <rect x="15" y="15" width="80" height="24" rx="4" fill="#2563eb"/>
        <text x="55" y="32" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">NODE 01</text>
        <text x="105" y="33" fill="#f8fafc" font-size="16" font-weight="700">Platform Core Host (m7i-flex.large / c7i-flex.large)</text>

        <!-- Pod 1: Backend -->
        <g transform="translate(15, 55)">
          <rect x="0" y="0" width="1030" height="155" rx="8" fill="#0f172a" stroke="#10b981"/>
          <rect x="15" y="12" width="80" height="22" rx="4" fill="#059669"/>
          <text x="55" y="27" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">BACKEND</text>
          <text x="105" y="28" fill="#f8fafc" font-size="15" font-weight="700">Pod: kyverno-backend (NestJS 11 Core API - Port 3001)</text>
          <text x="15" y="55" fill="#4ade80" font-size="13" font-weight="700">• IRSA Identity &amp; Bedrock Role:</text>
          <text x="230" y="55" fill="#cbd5e1" font-size="13">ServiceAccount: kyverno-backend-sa | 하드코딩 Secret Key 100% 제거</text>
          <text x="15" y="80" fill="#cbd5e1" font-size="13">• <tspan fill="#38bdf8" font-weight="700">Dual-Path GitOps Service</tspan>: PolicyException K8s CRD 배포 + GitHub PR 자동 생성</text>
          <text x="15" y="105" fill="#cbd5e1" font-size="13">• <tspan fill="#c084fc" font-weight="700">Bedrock AI Copilot</tspan>: Claude 3.5 Sonnet 연동, 3.5s Circuit Breaker 및 룰 템플릿 Fallback</text>
          <text x="15" y="130" fill="#cbd5e1" font-size="13">• <tspan fill="#fbbf24" font-weight="700">MultiClusterProvider</tspan>: Hub, Spoke, Tier2, Kind 멀티 클러스터 K8s API 동적 제어</text>
        </g>

        <!-- Pod 2: Frontend -->
        <g transform="translate(15, 225)">
          <rect x="0" y="0" width="1030" height="155" rx="8" fill="#0f172a" stroke="#0284c7"/>
          <rect x="15" y="12" width="80" height="22" rx="4" fill="#0284c7"/>
          <text x="55" y="27" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">FRONTEND</text>
          <text x="105" y="28" fill="#f8fafc" font-size="15" font-weight="700">Pod: kyverno-frontend (Next.js 15 Standalone - Port 3000)</text>
          <text x="15" y="55" fill="#38bdf8" font-size="13" font-weight="700">• 80%+ Docker Image Shrink:</text>
          <text x="240" y="55" fill="#cbd5e1" font-size="13">Next.js 15 Standalone Output 빌드로 런타임 메모리 및 트래픽 절감</text>
          <text x="15" y="80" fill="#cbd5e1" font-size="13">• <tspan fill="#38bdf8" font-weight="700">실시간 관제실 (/demo/cluster-live)</tspan>: HTML5 Canvas 기반 인터랙티브 라이브 토폴로지</text>
          <text x="15" y="105" fill="#cbd5e1" font-size="13">• <tspan fill="#38bdf8" font-weight="700">클라이언트 캐시</tspan>: TanStack React Query v5 &amp; Zustand (중복 네트워크 호출 방지)</text>
          <text x="15" y="130" fill="#cbd5e1" font-size="13">• <tspan fill="#38bdf8" font-weight="700">MLOps &amp; AI 대화창</tspan>: YAML 자동 생성 및 원클릭 복사, 관리자 승인 결재 플로우</text>
        </g>

        <!-- Pod 3: Database -->
        <g transform="translate(15, 395)">
          <rect x="0" y="0" width="1030" height="165" rx="8" fill="#0f172a" stroke="#6366f1"/>
          <rect x="15" y="12" width="80" height="22" rx="4" fill="#4f46e5"/>
          <text x="55" y="27" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">DATABASE</text>
          <text x="105" y="28" fill="#f8fafc" font-size="15" font-weight="700">Pod: postgres (PostgreSQL 16 StatefulSet - Port 5432)</text>
          <text x="15" y="55" fill="#818cf8" font-size="13" font-weight="700">• Persistent Volume Claim:</text>
          <text x="210" y="55" fill="#cbd5e1" font-size="13">EBS gp3 20GB 볼륨 마운트 (postgres-storage) &amp; 자동 스냅샷</text>
          <text x="15" y="80" fill="#cbd5e1" font-size="13">• <tspan fill="#818cf8" font-weight="700">Prisma ORM 6 스키마</tspan>: User, UserCluster, ExceptionRequest, AuditLogs, ManagedViolationStatus</text>
          <text x="15" y="105" fill="#cbd5e1" font-size="13">• <tspan fill="#818cf8" font-weight="700">마이그레이션 자동화</tspan>: 배포 파이프라인에서 pnpm prisma migrate deploy 자동 수행</text>
          <text x="15" y="130" fill="#cbd5e1" font-size="13">• <tspan fill="#818cf8" font-weight="700">연결 복원력</tspan>: 풀링 및 커넥션 자동 재시도 핸들러 탑재</text>
        </g>
      </g>

      <!-- Worker Node 2 -->
      <g transform="translate(1100, 55)">
        <rect x="0" y="0" width="1070" height="580" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
        <rect x="15" y="15" width="80" height="24" rx="4" fill="#db2777"/>
        <text x="55" y="32" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">NODE 02</text>
        <text x="105" y="33" fill="#f8fafc" font-size="16" font-weight="700">Kyverno HA &amp; MLOps Tenant (m7i-flex.large / c7i-flex.large)</text>

        <!-- Kyverno Controllers -->
        <g transform="translate(15, 55)">
          <rect x="0" y="0" width="1040" height="235" rx="8" fill="#0f172a" stroke="#ec4899"/>
          <rect x="15" y="12" width="110" height="22" rx="4" fill="#db2777"/>
          <text x="70" y="27" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">KYVERNO HA</text>
          <text x="135" y="28" fill="#f8fafc" font-size="15" font-weight="700">Kyverno v1.12.0 Admission &amp; Policy Background Engine</text>

          <g transform="translate(15, 45)">
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="495" height="175" rx="6" fill="#1e293b" stroke="#334155"/>
              <text x="15" y="24" fill="#f472b6" font-size="13" font-weight="700">Admission Controller (2 Replicas HA)</text>
              <text x="15" y="50" fill="#cbd5e1" font-size="12">• Validating / Mutating Webhook Server</text>
              <text x="15" y="75" fill="#cbd5e1" font-size="12">• PolicyException v2beta1 런타임 면제 매칭</text>
              <text x="15" y="100" fill="#cbd5e1" font-size="12">• admissionReports: false 설정으로 etcd 부하 방지</text>
              <text x="15" y="125" fill="#cbd5e1" font-size="12">• Enforce / Audit 모드 실시간 집행</text>
              <text x="15" y="150" fill="#4ade80" font-size="12">Multi-AZ 무중단 고가용성 보장</text>
            </g>

            <g transform="translate(515, 0)">
              <rect x="0" y="0" width="495" height="175" rx="6" fill="#1e293b" stroke="#334155"/>
              <text x="15" y="24" fill="#f472b6" font-size="13" font-weight="700">Background &amp; Reports Controller</text>
              <text x="15" y="50" fill="#cbd5e1" font-size="12">• 주기적 클러스터 전체 리소스 감사 (1h 스캔)</text>
              <text x="15" y="75" fill="#cbd5e1" font-size="12">• PolicyReport &amp; ClusterPolicyReport CRD 생성</text>
              <text x="15" y="100" fill="#cbd5e1" font-size="12">• 시스템 네임스페이스 자동 예외 처리</text>
              <text x="15" y="125" fill="#cbd5e1" font-size="12">• 만료된 PolicyException 자동 정리 (TTL Sweeper)</text>
              <text x="15" y="150" fill="#38bdf8" font-size="12">표준 Kubernetes PolicyReport CRD 100% 호환</text>
            </g>
          </g>
        </g>

        <!-- MLOps Subsystem & Free-Tier FinOps -->
        <g transform="translate(15, 305)">
          <rect x="0" y="0" width="1040" height="255" rx="8" fill="#0f172a" stroke="#f59e0b"/>
          <rect x="15" y="12" width="100" height="22" rx="4" fill="#d97706"/>
          <text x="65" y="27" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">MLOPS &amp; FINOPS</text>
          <text x="125" y="28" fill="#f8fafc" font-size="15" font-weight="700">MLOps Notebook Hub &amp; AWS Free-Tier Cost Optimization</text>

          <g transform="translate(15, 45)">
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="495" height="195" rx="6" fill="#1e293b" stroke="#334155"/>
              <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="700">MLOps Kubeflow Hub Subsystem</text>
              <text x="15" y="50" fill="#cbd5e1" font-size="12">• Kubeflow Notebooks (kubeflow.org/v1 CRD)</text>
              <text x="15" y="75" fill="#cbd5e1" font-size="12">• PyTorch 2.1 / TensorFlow 맞춤형 런타임</text>
              <text x="100" y="100" fill="#cbd5e1" font-size="12">• 5GB Persistent User Home PVC 자동 마운트</text>
              <text x="15" y="125" fill="#cbd5e1" font-size="12">• 웹 콘솔에서 Start / Stop / Delete 생명주기 제어</text>
              <text x="15" y="150" fill="#cbd5e1" font-size="12">• IdleWorkloadMonitorService (유휴 자원 자동 회수)</text>
              <text x="15" y="175" fill="#a78bfa" font-size="12">GPU Quota 분배 및 Non-Root 보안 격리</text>
            </g>

            <g transform="translate(515, 0)">
              <rect x="0" y="0" width="495" height="195" rx="6" fill="#1e293b" stroke="#334155"/>
              <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="700">AWS EKS Cost Optimization ($0 Target)</text>
              <text x="15" y="50" fill="#cbd5e1" font-size="12">• 월 750시간 EC2 Free Tier 컴퓨팅 한도 준수</text>
              <text x="15" y="75" fill="#cbd5e1" font-size="12">• EBS 30GB gp3 무료 스토리지 한도 철저 관리</text>
              <text x="15" y="100" fill="#cbd5e1" font-size="12">• <tspan fill="#4ade80" font-weight="700">Build Offloading</tspan>: GitHub Actions에서 빌드 전담</text>
              <text x="15" y="125" fill="#cbd5e1" font-size="12">  - 인클러스터 컴파일/도커 빌드 부하 및 OOM 방지</text>
              <text x="15" y="150" fill="#cbd5e1" font-size="12">• VPC CNI Prefix Delegation으로 노드당 파드수 극대화</text>
              <text x="15" y="175" fill="#38bdf8" font-size="12">소형 인스턴스로 엔터프라이즈급 거버넌스 구현</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Flow Arrows -->
  <path d="M 430,300 L 430,405" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrBlue2)"/>
  <rect x="360" y="340" width="140" height="22" rx="4" fill="#0f172a" stroke="#38bdf8"/>
  <text x="430" y="355" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">HTTPS Inbound</text>
</svg>