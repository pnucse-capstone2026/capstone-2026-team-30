name: Project CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: kyverno_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # PR에서 실제 변경된 경로를 감지해 불필요한 빌드 건너뜀
      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            policies:
              - 'k8s-manifests/policies/**'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Lint (Backend)
        if: steps.filter.outputs.backend == 'true'
        run: pnpm --filter @kyverno-platform/backend lint

      - name: Lint (Frontend)
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm --filter @kyverno-platform/frontend lint

      - name: Prisma Generate & DB Push
        if: steps.filter.outputs.backend == 'true'
        env:
          DATABASE_URL: postgresql://devuser:devpassword@localhost:5432/kyverno_dashboard?schema=public
        run: |
          pnpm --filter @kyverno-platform/backend exec prisma generate
          pnpm --filter @kyverno-platform/backend exec prisma db push

      - name: Test (Backend)
        if: steps.filter.outputs.backend == 'true'
        env:
          DATABASE_URL: postgresql://devuser:devpassword@localhost:5432/kyverno_dashboard?schema=public
        run: pnpm --filter @kyverno-platform/backend test

      - name: Build Backend (NestJS)
        if: steps.filter.outputs.backend == 'true'
        run: pnpm --filter @kyverno-platform/backend build

      - name: Build Frontend (Next.js)
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm --filter @kyverno-platform/frontend build

      # 정책 파일 문법 오류를 병합 전에 차단
      - name: Validate Kyverno Policies
        if: steps.filter.outputs.policies == 'true'
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: 'v1.12.0'
      
      - name: Run kyverno validate
        if: steps.filter.outputs.policies == 'true'
        run: kyverno validate k8s-manifests/policies/
