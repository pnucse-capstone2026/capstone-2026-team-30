name: Frontend CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/frontend/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
  push:
    branches: ["main"]
    paths:
      - "apps/frontend/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Lint (Frontend)
        run: pnpm --filter @kyverno-platform/frontend lint

      # Next.js standalone 최적화 번들 빌드 가능 여부를 병합 전 검증
      - name: Build Frontend (Next.js)
        run: pnpm --filter @kyverno-platform/frontend build
